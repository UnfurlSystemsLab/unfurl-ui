services:
  unfurl-fabric:
    image: ${UNFURL_FABRIC_IMAGE:-ghcr.io/unfurlsystemslab/unfurl-fabric-studio:0.1.0-snapshot}
    container_name: unfurl-fabric-studio
    ports:
      - "${UNFURL_FABRIC_PORT:-7878}:7878"
    environment:
      JAVA_OPTS: ${UNFURL_FABRIC_JAVA_OPTS:-}
      UNFURL_STUDIO_BIND: "0.0.0.0"
      UNFURL_STUDIO_PORT: "7878"
      UNFURL_STUDIO_STATE_PATH: /opt/unfurl/fabric/state/studio-state.json
      UNFURL_FOUNDRY_DCP_ENDPOINT: http://unfurl-foundry:7979/dcp/agent.run
    volumes:
      - unfurl-fabric-state:/opt/unfurl/fabric/state
    networks:
      - unfurl-lab

  unfurl-foundry:
    image: ${UNFURL_FOUNDRY_IMAGE:-ghcr.io/unfurlsystemslab/unfurl-foundry:0.1.0-snapshot}
    container_name: unfurl-foundry-agent
    ports:
      - "${UNFURL_FOUNDRY_PORT:-7979}:7979"
    environment:
      JAVA_OPTS: ${UNFURL_FOUNDRY_JAVA_OPTS:-}
      UNFURL_FOUNDRY_PORT: "7979"
      UNFURL_FOUNDRY_DEPLOYMENT_ROOT: /opt/unfurl/foundry
      # This Lab stack has no identity provider, so Foundry runs its development profile (authentication disabled,
      # trusted network; root CLAUDE.md rule 6). The image defaults to the secured profile, which needs JWT keys.
      UNFURL_FOUNDRY_PROFILE: profiles/foundry-runtime-profile.yaml
      UNFURL_FOUNDRY_MODEL_PROVIDER: ${UNFURL_FOUNDRY_MODEL_PROVIDER:-spring-ai-google-genai}
      UNFURL_FOUNDRY_MODEL_REF: ${UNFURL_FOUNDRY_MODEL_REF:-customer-configured}
      UNFURL_FOUNDRY_MODEL_NAME: ${UNFURL_FOUNDRY_MODEL_NAME:-gemini-3.1-flash-lite}
      UNFURL_FOUNDRY_GEMINI_THINKING_BUDGET: ${UNFURL_FOUNDRY_GEMINI_THINKING_BUDGET:-0}
      UNFURL_FOUNDRY_CREDENTIAL_KEY: ${UNFURL_FOUNDRY_CREDENTIAL_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    # Foundry's mount contract (unfurl-foundry/Dockerfile): each deployment concern read-only, and the selected profile's
    # state folder writable. The development profile keeps its state in .foundry/. Never the whole root read-only, or
    # the profile has no writable state.
    volumes:
      - ./.startup/foundry-deployment/profiles:/opt/unfurl/foundry/profiles:ro
      - ./.startup/foundry-deployment/agents:/opt/unfurl/foundry/agents:ro
      - ./.startup/foundry-deployment/compositions:/opt/unfurl/foundry/compositions:ro
      - ./.startup/foundry-deployment/prompts:/opt/unfurl/foundry/prompts:ro
      - ./.startup/foundry-deployment/registries:/opt/unfurl/foundry/registries:ro
      - ./.startup/foundry-deployment/tools:/opt/unfurl/foundry/tools:ro
      - ./.startup/foundry-deployment/providers:/opt/unfurl/foundry/providers:ro
      - ./.startup/foundry-deployment/identity:/opt/unfurl/foundry/identity:ro
      - ./.startup/foundry-deployment/secrets:/opt/unfurl/foundry/secrets:ro
      - unfurl-foundry-state:/opt/unfurl/foundry/.foundry
    networks:
      - unfurl-lab

  unfurl-flow:
    image: ${UNFURL_FLOW_IMAGE:-ghcr.io/unfurlsystemslab/unfurl-flow:0.1.0-snapshot}
    container_name: unfurl-flow-runtime
    ports:
      - "${UNFURL_FLOW_PORT:-8080}:8080"
    environment:
      JAVA_OPTS: ${UNFURL_FLOW_JAVA_OPTS:-}
      UNFURL_FLOW_DEPLOYMENT_ROOT: ${UNFURL_FLOW_DEPLOYMENT_ROOT:-}
    networks:
      - unfurl-lab

networks:
  unfurl-lab:
    name: unfurl-lab

volumes:
  unfurl-fabric-state:
  unfurl-foundry-state:
